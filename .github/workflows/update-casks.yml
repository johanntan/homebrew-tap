name: Update casks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1

      - name: Update casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          casks=(astris)
          updated=()

          for cask in "${casks[@]}"; do
            package="$GITHUB_REPOSITORY/$cask"
            livecheck="$(brew livecheck --json --newer-only "$package")"
            latest="$(jq -r '.[0].version.latest // empty' <<<"$livecheck")"

            if [[ -z "$latest" ]]; then
              continue
            fi

            brew bump-cask-pr \
              --write-only \
              --no-audit \
              --no-style \
              --version="$latest" \
              "$package"
            updated+=("$cask")
          done

          if [[ "${#updated[@]}" -eq 0 ]]; then
            echo "No cask updates available."
            exit 0
          fi

          brew style --fix "${updated[@]/#/$GITHUB_REPOSITORY/}"
          brew audit --cask "${updated[@]/#/$GITHUB_REPOSITORY/}"

          git add Casks
          git commit -m "Update ${updated[*]}"

      - name: Push updates
        uses: Homebrew/actions/git-try-push@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          branch: main
